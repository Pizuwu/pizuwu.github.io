# fredy für Coolify (Docker Compose Deployment aus diesem Git-Repo)
#
# In Coolify unter "Docker Compose Location" diesen Pfad eintragen:
#   /haussuche-fredy/docker-compose.coolify.yml
#
# SERVICE_FQDN_FREDY_9998 lässt Coolify automatisch eine Domain erzeugen und
# den Traefik-Proxy auf Port 9998 im Container routen. Deshalb hier bewusst
# kein "ports:" - der Container bleibt vom Internet aus nur über den Proxy
# mit HTTPS erreichbar.
services:
  fredy:
    image: ghcr.io/orangecoding/fredy:latest
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_FREDY_9998
      - NODE_ENV=production
    volumes:
      - fredy-db:/db
      - fredy-conf:/conf
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:9998/"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  fredy-db:
  fredy-conf:
