name: kleinanzeigen-scan

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Einzelnes Inserat zur Analyse holen (leer = normaler Scan)'
        required: false
        default: ''
      probe:
        description: 'Erreichbarkeit aller Portale testen'
        required: false
        default: 'false'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: ka-scan-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kleinanzeigen abrufen
        if: ${{ github.event.inputs.url == '' }}
        run: node scripts/ka-fetch.mjs
      - name: Portale testen
        if: ${{ github.event.inputs.probe == 'true' }}
        run: node scripts/portal-probe.mjs
      - name: Einzelnes Inserat holen
        if: ${{ github.event.inputs.url != '' }}
        env:
          INTAKE_URL: ${{ github.event.inputs.url }}
        run: node scripts/intake-fetch.mjs
      - name: Ergebnis committen
        run: |
          git config user.name "ka-scan-bot"
          git config user.email "ka-scan-bot@users.noreply.github.com"
          git add data/ka-live.json data/portal-probe.json data/intake 2>/dev/null || true
          if git diff --cached --quiet; then echo "keine Aenderung"; exit 0; fi
          git commit -m "runner: $(date -u +'%Y-%m-%d %H:%M UTC') ${{ github.event.inputs.url != '' && 'intake' || (github.event.inputs.probe == 'true' && 'probe' || 'ka-live') }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
