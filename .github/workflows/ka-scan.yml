name: kleinanzeigen-scan

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: ka-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kleinanzeigen abrufen
        run: node scripts/ka-fetch.mjs
      - name: Ergebnis committen
        run: |
          git config user.name "ka-scan-bot"
          git config user.email "ka-scan-bot@users.noreply.github.com"
          git add data/ka-live.json
          if git diff --cached --quiet; then echo "keine Aenderung"; exit 0; fi
          git commit -m "ka-live: Kleinanzeigen-Stand $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
